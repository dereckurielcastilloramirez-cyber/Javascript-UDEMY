<!DOCTYPE html>
<!-- Este es un comentario de una sola línea -->
    <head>
        <title> TIPOS DE DATOS </title>
        <!-- Importamos el archivo CSS para los estilos -->
        <link rel="stylesheet" href="styles_var.css">
    </head>
    <body>
        
        <script>
            let miVariable;
            miVariable = "Hola, soy una variable" ;
            // Tipo de dato: String

            let miArray = [1, 2, 3, 4, 5];
            // Tipo de dato: Array

            let miLista = ["Hola", 42, true, 3.14];
            // Tipo de dato: Lista (Array con diferentes tipos)

            alert(miVariable);

            alert(miArray);

            alert(miLista[2]);
        </script>
    </body>

</html>
