<!DOCTYPE html>
<!-- Este es un comentario de una sola línea -->
    <head>
        <title> Ingresos de usuario </title>
    </head>
    <body>    
        <p> ingresa tu nombre </p>
        <input type="text" id="username">
        <button onclick="mostrarNombre()"> INGRESAR </button>
        <h1 id="salida"> No sé tu nombre </h1>

        <script>
            function mostrarNombre() {
                let nombreUsuario = document.getElementById("username");
                let elementoTexto = document.getElementById("salida");
                let mensaje = "Tu te llamas " + nombreUsuario.value + ", bienvenido a la página.";
                //Cambiar contenido de texto"
                elementoTexto.textContent = mensaje;
                

            }
        </script>
    </body>

</html>
