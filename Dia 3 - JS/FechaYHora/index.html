<!DOCTYPE html>
<!-- https://developer.mozilla.org/es/docs/Web/HTML/Reference/Elements/audio -->
    <head>
        <title> Reproductor Audio </title>
        <!-- Importamos el archivo CSS para los estilos -->
        <link rel="stylesheet" href="styles_var.css">
    </head>
    <body onload="comenzarReloj()">
        <input type="number" id="tiempo" placeholder="Ingrese el tiempo en segundos">
        <button onclick="comenzarTiempo()"> Alarma </button>
        <h1 id="textoAlarma"> 00:00:00 </h1>

        <!-- Elemento de audio para reproducir la alarma agregado en html -->
        <audio id = "audioAlarma">
            <source src="Audios/alarma.mp3" type="audio/mpeg">
            Sonido no habilitado
        </audio>

        <script>
            let elementosSegundos = document.getElementById("tiempo");
            let elementoTextoAlarma = document.getElementById("textoAlarma");
            let elementoSonidoAlarma = document.getElementById("audioAlarma");

            function comenzarTiempo() {
                setTimeout(tiempoCumplido, elementosSegundos.value * 1000); // El temporizador se activa después de 5 segundos (5000 milisegundos)
                mostrarFecha();
            }

            function tiempoCumplido() {
                elementoTextoAlarma.textContent = "ENCENDIDO";
                elementoTextoAlarma.style.color = "green";
                elementoSonidoAlarma.play();
            }

            function comenzarReloj() {
                setInterval(ticTac, 1000); // Actualiza el reloj cada segundo (1000 milisegundos)
            }

            function ticTac() {
                let tiempoActual = new Date();
                let horas = String(tiempoActual.getHours()).padStart(2, '0');
                let minutos = String(tiempoActual.getMinutes()).padStart(2, '0');
                let segundos = String(tiempoActual.getSeconds()).padStart(2, '0');


                elementoTextoAlarma.textContent = horas + ":" + minutos + ":" + segundos;
            }

            function mostrarFecha() {
               let diaActual = new Date().toLocaleDateString("es-ES", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
               alert("La alarma está para el " + diaActual);
            }

            function mostrarFecha2() {
                var fecha = new Date();
                alert(fecha.toLocaleDateString('es-ES'));
            }



        </script>
    </body>

</html>
