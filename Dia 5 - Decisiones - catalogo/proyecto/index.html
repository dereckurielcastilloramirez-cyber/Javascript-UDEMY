<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="contenedor">
        <section class="tarjeta">
            <p class="subtitulo">Catalogo interactivo</p>
            <h1>Bienvenido al cine</h1>
            <p class="descripcion">
                Te recomendaremos una pelicula segun tu edad y el genero que prefieras.
            </p>

            <div class="campo">
                <label for="edadCliente">Ingresa tu edad</label>
                <input type="number" id="edadCliente" min="1" max="100" placeholder="Ej. 18">
            </div>

            <div class="campo">
                <p class="campo-titulo">Elige un genero de pelicula</p>
                <div class="acciones">
                    <button class="boton-genero drama" onclick="recomendar('Drama')">Drama</button>
                    <button class="boton-genero comedia" onclick="recomendar('Comedia')">Comedia</button>
                    <button class="boton-genero accion" onclick="recomendar('Accion')">Accion</button>
                </div>
            </div>

            <section class="resultado">
                <p class="resultado-etiqueta">Pelicula recomendada</p>
                <h3 id="peliculaRecomendada">Tu recomendacion aparecera aqui.</h3>
            </section>
        </section>
    </main>
</body>
</html>
